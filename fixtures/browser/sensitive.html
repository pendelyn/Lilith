<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sensitive fields</title>
</head>
<body>
  <h1>Sensitive fields</h1>
  <form>
    <label>Password <input id="pw" name="password" type="password" value="hunter2-secret" autocomplete="current-password"></label>
    <label>Card <input id="cc" name="card" autocomplete="cc-number" value="4111111111111111"></label>
    <label>CVC <input id="cvc" name="cvc" autocomplete="cc-csc" value="123"></label>
    <label>Token <input id="tok" name="token" type="text" value="named-token-secret" title="named-token-secret" aria-label="named-token-secret"></label>
    <label>API key <input id="ak" name="api_key" type="text" value="named-apikey-secret"></label>
    <label>Client secret <input id="cs" name="client_secret" type="text" value="named-client-secret"></label>
    <label>Textarea password <textarea id="tpw" name="password">textarea-password-secret</textarea></label>
    <label>OTP <input id="otp" name="otp" autocomplete="one-time-code" value="named-otp-secret"></label>
  </form>
  <p id="visible">Visible page text is not claimed redacted.</p>
  <canvas id="cv" width="220" height="40"></canvas>
  <script>
    const canvas = document.getElementById("cv");
    if (canvas instanceof HTMLCanvasElement) {
      const ctx = canvas.getContext("2d");
      if (ctx) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 220, 40);
        ctx.fillStyle = "#111111";
        ctx.fillText("SECRET-CANVAS", 8, 24);
      }
    }
  </script>
</body>
</html>
